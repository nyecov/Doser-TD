id: TCD-29c1-001
title: Third-party user generates and submits a sanitized issue report
level: feature
format: gherkin
gherkin: "Feature: Third-party issue reporting\n  Scenario: Generate a safe report\
  \ without an initialized project\n    Given trapdoor-mcp is installed outside a\
  \ Trapdoor project\n    When the user runs trapdoor report with problem details\n\
  \    Then Markdown and JSON report files are generated\n    And the JSON uses schema\
  \ trapdoor.issue_report.v1\n    And a public support issue URL is printed\n\n  Scenario:\
  \ Redact sensitive diagnostic content\n    Given optional diagnostic text contains\
  \ credentials and a private Git remote\n    When the user generates an issue report\
  \ including that text\n    Then credential values and private remote details are\
  \ replaced with redaction markers\n    And the generated public report does not\
  \ contain the original sensitive values\n\n  Scenario: Guide an AI agent through\
  \ report submission\n    Given a third-party AI agent has the packaged Trapdoor\
  \ skill\n    When the user asks it to report a Trapdoor problem\n    Then the skill\
  \ identifies the public support destination\n    And it gathers reproduction, expected,\
  \ actual, and error details\n    And it requires the user to review the report before\
  \ submission\n\n  Scenario: Import remains a maintainer responsibility\n    Given\
  \ a report exists in the public support repository\n    When a maintainer agent\
  \ processes the issue\n    Then it uses GitHub tooling to read the issue\n    And\
  \ it uses existing Trapdoor MCP item tools to create or update the private ticket\n\
  \    And Trapdoor MCP exposes no GitHub issue polling tool"
