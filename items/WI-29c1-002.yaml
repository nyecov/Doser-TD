title: Architecture - Clean Architecture Design
description: 'Doser V3 is a single-user, local-first application built on Clean Architecture
  principles. Layers: Interfaces (HTMX templates, HTTP handlers), Application (use-case
  services, orchestration), Domain (pure structs, business rules, RDI), Infrastructure
  (SQLiteRepository, GarminClient). Cross-service orchestration follows strict synchronous
  sequence.'
