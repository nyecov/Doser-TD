id: WI-29c1-073
title: Migrate Backlog Milestones to TrapDoor
description: '# Goal


  Migrate all records under `sdlc_backlog/backlog/milestones/` into TrapDoor as typed
  milestone records.


  # Source Inventory


  - 1 Markdown milestone record


  # Acceptance Criteria


  - Every source milestone maps to exactly one TrapDoor milestone record without duplicates.

  - Milestone date, status, scope, health snapshot, metrics, comments, timestamps,
  and source path are preserved.

  - Related initiatives, epics, stories, risks, and release evidence are linked using
  TrapDoor IDs.

  - Source checksum and legacy-ID provenance are retained.

  - Source and destination counts and semantic content pass parity validation before
  cutover.

  - The legacy folder is retained until the migration epic''s atomic cutover gate
  passes.'
