id: WI-29c1-006
title: GoalBoost - Goal-Based RDI Amplification
description: '# GoalBoost


  #concept #solver


  Multiplier applied to BaseTarget to produce the Anchor used in RDI calculation.
  Encodes the user''s positive goals and negative restrictions into a single bounded
  factor.


  ## Formula

  PosBoost = max(1.0, highest multiplier where multiplier > 1.0)   // default 1.0

  NegBoost = min(1.0, lowest multiplier where multiplier < 1.0)    // default 1.0

  GoalBoost = min(PosBoost x NegBoost, solver_goal_boost_cap)       // cap default:
  3.0


  - Multipliers of exactly 1.0 are neutral - excluded from both boosts

  - Only the strongest positive and strongest negative multipliers apply - no compounding
  across multiple goals of the same sign


  ## Cap (3.0x)

  Prevents runaway compounding. If multiple strong positive goals exist, only the
  highest applies.


  ## Floor (0.05x)

  Prevents extreme restriction multipliers (e.g. 0.001x) from near-zeroing an ingredient
  without an explicit zero tag. Default: 0.05 via user_settings. Risk: may interfere
  with users who have legitimate extreme restrictions (e.g. severe renal disease).


  ## Where GoalBoost Feeds

  Anchor = BaseTarget x GoalBoost

  Anchor is then used as the reference point for Interactions (dose/anchor saturation
  curves).'
