id: WI-29c1-020
title: Global Swap - Bucket Reassignment
description: '# Global Swap


  Look-ahead optimization in Phase 4-5 - Transactional Allocation. When Product B
  is blocked from its preferred bucket by a higher-utility Product A, the solver attempts
  to move Product A elsewhere to free the slot.


  ## Trigger

  Product B (Utility Score U_B) desires Bucket K.

  - Capacity Failure (Gate 4): Bucket K is full -> find displacement victim (lowest
  utility).

  - Constraint Failure (Gate 1 or 2): Product B blocked by Antagonism -> target specific
  antagonist.

  - Resolution Priority: Capacity (Gate 4) -> Antagonism (Gate 2) -> Separation (Gate
  1).

  - Priority Guard: Only attempted if UtilityScore(Product B) > UtilityScore(Victim).


  ## Displacement Victim Selection

  1. Immovability Filter: Medical Pins and Regular Pins are strictly ineligible.

  2. Victim Heuristic: Lowest UtilityScore -> Lowest BucketWeight -> Lowest ProductID.

  3. Utility Guard: Only swap if U_B > U_Victim.


  ## Relocation (DFS Backtracking)

  1. Try to move Victim A to an alternative valid bucket.

  2. Medical Pin Guard: If blocking product is a Medical Pin, swap fails instantly.

  3. Internal Reversal: Tentative move may trigger Reversal Mechanic in alternative
  bucket.

  4. DFS Backtracking: Try all fallback buckets recursively up to solver_swap_depth.

  5. If valid swap chain found -> place Product B in freed slot.


  ## Primary Ingredient Definition

  Static Override (products.primary_ingredient_id) -> Dynamic Contribution (highest
  Amount/RDI_Target) -> Safety Tie-Breaker (highest MaxDailyLimit).


  ## Commit / Rollback

  - Successful chain: Commit all ctx.Remaining, BucketRawTotals changes; log relocation.

  - Partial chain: Rollback all tentative moves; restore pre-swap state.

  - No valid chain: SchedulingConflict raised.


  ## Loop Detection

  If swap creates a cycle (A displaces B displaces A), treat as Partial Chain and
  rollback.'
