id: WI-29c1-070
title: Migrate Backlog Follow-Ups to TrapDoor
description: '# Goal


  Migrate all records under `sdlc_backlog/backlog/followups/` into TrapDoor as typed
  non-blocking follow-up records.


  # Source Inventory


  - 1 active Markdown follow-up record


  # Acceptance Criteria


  - Every source follow-up maps to exactly one TrapDoor follow-up record without duplicates.

  - Lifecycle, routing metadata, non-blocking rationale, priority, comments, timestamps,
  and source path are preserved.

  - Related stories, issues, bugs, specifications, and affected work are linked using
  TrapDoor IDs.

  - Follow-ups remain excluded from blocking BUG/ISSUE gates unless an explicit blocker
  relationship exists.

  - Source and destination counts and semantics pass parity validation before cutover.

  - The legacy folder is retained until the migration epic''s atomic cutover gate
  passes.'
