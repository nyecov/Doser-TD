id: WI-29c1-069
title: Migrate Backlog Epics to TrapDoor
description: '# Goal


  Migrate all records under `sdlc_backlog/backlog/epics/` into TrapDoor as typed epic
  records while preserving hierarchy, lifecycle, and specification traceability.


  # Source Inventory


  - 12 Markdown epic records


  # Acceptance Criteria


  - Every source epic maps to exactly one TrapDoor epic record without duplicates.

  - Epic lifecycle, priority, description, success criteria, citations, comments,
  and timestamps are preserved.

  - Parent initiative and child story relationships are reconstructed using TrapDoor
  IDs.

  - Test-plan ownership, specification coverage, dependencies, and migration provenance
  are retained.

  - Source and destination counts and hierarchy pass parity validation before cutover.

  - The legacy folder is retained until the migration epic''s atomic cutover gate
  passes.'
