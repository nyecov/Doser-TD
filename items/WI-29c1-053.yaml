id: WI-29c1-053
title: Implementation Risks
description: '# Implementation Risks


  Open risks identified during V3 spec audit. Must be resolved before solver.go and
  rdi.go are considered Gold.


  Resolved Risks:

  - Risk 1 - Limits vs Remaining Conflation: Enforce read-only access to ctx.Limits,
  decrement only ctx.Remaining.

  - Risk 2 - Efficiency Floor Check Before Rounding: Strict procedural ordering in
  Solve().

  - Risk 3 - Zero Baseline Utility for Ungoaled Ingredients: BaseScore = Sum(Amount_i
  / MaxDailyLimit_i).


  Open Risks:

  - Risk 4 - Hard Limit Clips Logging: When MaxDailyLimit clips RDI, the clip must
  be logged as ExplanationFactor with Source format "Hard Limit D<N>".

  - Risk 5 - Reversal Loop Max Passes: Risk of infinite reversal chains. Mitigated
  by reversal_max_passes (default 3) with chain-breaker.

  - Risk 6 - Global Swap Performance: solver_swap_depth is primary performance governor.
  If execution exceeds 2s, hard timeout fallback needed.

  - Risk 7 - Scale Metric Override Integrity: Scale data must always override Watch
  for same metric. Stale decay enforcement needed.'
