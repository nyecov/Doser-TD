id: WI-29c1-071
title: Migrate Backlog Initiatives to TrapDoor
description: '# Goal


  Migrate all records under `sdlc_backlog/backlog/initiatives/` into TrapDoor as typed
  initiative records while preserving top-level product hierarchy.


  # Source Inventory


  - 1 Markdown initiative record


  # Acceptance Criteria


  - Every source initiative maps to exactly one TrapDoor initiative record without
  duplicates.

  - Initiative lifecycle, objectives, scope, success criteria, citations, comments,
  and timestamps are preserved.

  - Child epic relationships and specification links are reconstructed using TrapDoor
  IDs.

  - Source checksum and legacy-ID provenance are retained.

  - Source and destination counts and hierarchy pass parity validation before cutover.

  - The legacy folder is retained until the migration epic''s atomic cutover gate
  passes.'
