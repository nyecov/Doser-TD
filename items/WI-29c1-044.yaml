title: Complex Path Flowchart
description: '# Complex Path Flowchart


  Full solver flowchart with reversals, substitutions, goals, tags, and synergies.
  Complex path showing all solver mechanics in action.


  Flow: User clicks Generate Plan -> Go Backend loads plan config -> Solver runs Phases
  0-2 -> Tag conflicts resolved -> Utility scoring with goal/tag adjustments -> Phase
  3.5 pre-placement -> Phase 4-5 with gate checks -> Reversal Mechanic fires -> Shortfall
  Re-run triggered -> Global Swap attempted if capacity blocked -> Loop Detection
  if cycles found -> Phase 6 explanation compilation


  Key Elements:

  - Multiple reversal passes

  - Substitution promotion from earmarked pool

  - Global swap chain with DFS backtracking

  - Loop detection with victim selection

  - Full explanation chain compiled


  Design reference: See Complex Path Flowchart in obsidian for the complete diagram.'
