title: Design System - Brand and Foundation
description: '# Design System - Brand and Foundation


  #component #design


  ## Brand Identity

  Doser V3 brand guidelines: color palette, typography, iconography, and visual language.
  Cross-reference to Figma/ design artifacts.


  ## Design Tokens

  - Colors: Primary (Medical Blue), Danger (Red tiers D0-D4), Success, Warning, Info

  - Typography: System font stack for UI, monospace for data

  - Spacing: 4px base unit

  - Border radius: 4px default, 8px cards


  ## Danger Tier Colors

  - D0 (Safe): Green

  - D1 (Low): Yellow

  - D2 (Moderate): Orange

  - D3 (High): Deep Orange

  - D4 (Hazardous): Red

  - Banned: Gray/Strikethrough


  ## UI Kit Components

  Badges, Chips, Buttons, Forms, Cards, Modals, Toasts, Navigation, Data Tables


  ## Design Assets

  Located in Figma/ directory: preview files for colors, icons, components, and the
  dashboard UI kit mock.'
