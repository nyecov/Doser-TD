id: WI-29c1-040
title: Documentation Repository - Repo Structure
description: '# Repository Sovereignty


  This repository is the single source of truth for the Doser V3 Technical Specification
  and its production implementation. Spec and code live together, with strict spec-first
  ordering.


  ## In Scope

  - Architectural blueprints and Clean Architecture layers

  - Solver logic, phase sequences, and flowcharts

  - Database schema definitions (SQLite V3)

  - Interaction, RDI, and GoalBoost formulas

  - Decision logs and Implementation Risks

  - Production source code under cmd/ and internal/

  - HTMX templates, vanilla CSS, and other production UI assets

  - Tooling under tools/ and CI/CD configuration


  ## Sanctioned Top-Level Directories

  - obsidian/ - Markdown specifications (canonical spec)

  - Figma/ - design system, brand tokens, throwaway React mocks

  - sdlc_backlog/ - Initiatives, Epics, Stories, Test artifacts

  - .skills/ - methodologies and tech-stack rules

  - cmd/ - Go application entry points

  - internal/ - Go production code

  - tools/ - utility scripts

  - test_data/ - raw JSON payloads, scraper artifacts


  ## Spec-First Ordering (Hard Rule)

  Whenever code and spec disagree, the obsidian/ spec is updated first, then derivatives
  reconciled, then implementation follows.'
