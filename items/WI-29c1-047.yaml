id: WI-29c1-047
title: System State Machine
description: '# System State Machine


  Macro-level operational lifecycle of the entire Doser V3 system.


  States:

  1. Initializing: Loading config, connecting database, starting sidecar

  2. Ready: System operational, waiting for user input

  3. Syncing: Garmin data sync in progress

  4. Solving: Solver executing (Phases 0-6)

  5. Error: System encountered a fault (recoverable)

  6. Degraded: Sidecar unavailable, limited functionality

  7. Blocked: Solver cannot run (missing weight, empty inventory)


  Transitions:

  - Initializing -> Ready (on successful startup)

  - Ready -> Syncing (user triggers sync or auto-sync)

  - Ready -> Solving (user clicks generate plan)

  - Syncing -> Ready (sync complete)

  - Solving -> Ready (plan generated)

  - Any -> Error (on unrecoverable fault)

  - Ready -> Degraded (sidecar failure)

  - Blocked -> Ready (blocking condition resolved)'
