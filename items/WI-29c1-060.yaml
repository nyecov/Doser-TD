id: WI-29c1-060
title: TrapDoor-Only Project Record Migration
description: '# Goal


  Replace Doser''s legacy Obsidian, Markdown backlog, and file-based test record systems
  with TrapDoor as the sole canonical store for product specifications and SDLC records.


  Migrate all active and historical records without duplicating the 59 specifications
  already imported into TrapDoor. Complete a validated atomic cutover only after schema,
  relationship, evidence, workflow, and parity checks pass.


  # Success Criteria


  - Doser-specific schemas preserve current lifecycle and governance semantics.

  - All remaining backlog, incident, coverage, test, and execution history is migrated
  and linked.

  - Existing imported specification records are reclassified in place.

  - Project workflows operate through TrapDoor MCP without legacy Markdown dependencies.

  - Legacy record directories are removed only after verified parity.'
