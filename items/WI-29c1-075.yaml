id: WI-29c1-075
title: Migrate Backlog Subtasks to TrapDoor
description: '# Goal


  Migrate all records under `sdlc_backlog/backlog/subtasks/` into TrapDoor as typed
  subtask records while preserving story decomposition and completion history.


  # Source Inventory


  - 325 Markdown subtask records


  # Acceptance Criteria


  - Every source subtask maps to exactly one TrapDoor subtask record without duplicates.

  - Subtask lifecycle, priority, scope, implementation notes, dependencies, comments,
  timestamps, and checkpoint data are preserved.

  - Parent story and related specification, code, test, BUG, and ISSUE relationships
  are reconstructed using TrapDoor IDs.

  - Source checksum and legacy-ID provenance are retained for every subtask.

  - No orphaned subtask remains after relationship reconstruction.

  - Source and destination counts and parent-child hierarchy pass parity validation
  before cutover.

  - The legacy folder is retained until the migration epic''s atomic cutover gate
  passes.'
