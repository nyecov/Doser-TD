id: WI-29c1-048
title: Product Lifecycle State Machine
description: '# Product Lifecycle State Machine


  Decision-making review diagram per product through its lifecycle within the Doser
  system.


  States:

  1. Candidate: Product in catalogue, eligible for scoring

  2. Scored: Utility score assigned in Phase 3

  3. Scheduled: User-defined serving schedule entry (Phase 3.5)

  4. Placed: Successfully allocated to a bucket

  5. Placed_Reduced: Allocated but at reduced serving

  6. Displaced: Evicted by Global Swap

  7. Reversed: Reversal Mechanic reduced or dropped this product

  8. Substituted: Earmarked substitute promoted to replace dropped product

  9. Filtered: Excluded by tag rules

  10. Dropped_Loop: Dropped by loop detection resolution


  Transitions follow the solver phase sequence, with state changes logged in the Explainability
  Engine with ExplanationFactor entries.


  Design reference: See Product Lifecycle State Machine in obsidian for the complete
  diagram.'
