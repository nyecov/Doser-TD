title: Refinement - Dynamic Formulas
description: '# Refinement - Dynamic Formulas


  Goal: Provide an intelligent, easy-to-use interaction for defining and modifying
  the dynamic formulas that drive the solver (RDI targets, interaction curves, and
  goal boosts).


  ## Requirements

  1. Intelligent Interaction: Variable autocomplete, semantic validation, LaTeX rendering

  2. Variable Support: Biometrics (Weight, Lean Mass, Stress, Hydration), Solver Constants
  (RDI_base, Goal Multipliers, Interaction Multipliers), Constraints (Hard Limit,
  Bucket Ceiling)

  3. UI Components: Formula editor with syntax highlighting, LaTeX preview panel,
  variable picker, validation feedback

  4. Integration: Formulas stored in user_settings or formula_registry table, loaded
  at solver runtime


  ## Status

  REFINE: Intelligent LaTeX formula interaction needed. This is a deferred refinement
  item awaiting design session.'
