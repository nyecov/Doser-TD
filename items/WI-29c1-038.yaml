title: Go Type Definitions - Core Structs
description: '# Go Type Definitions


  Complete Go type definitions for the solver domain. All types live in internal/domain/
  or internal/core/logic/.


  ## Interaction

  type Interaction struct { ID, IngredientA_ID, IngredientB_ID int64; ImpactMultiplier
  float64; Curve string; ThresholdPct float64; SeparationHours int; IsUserDefined
  bool; AffectedIngredientID *int64 }


  ## SolverContext

  Key fields: Limits (fixed hard ceilings), Remaining (unfilled RDI budget), BucketRawTotals,
  BucketAdjustedTotals, MedicalPins, ServingSchedules, Settings (SolverSettings),
  Conflicts (accumulated ConflictReport), PinnedIngredientTotals, ZeroedIngredients,
  ExcludedProducts, MultiplierOverrides, AbsoluteCeilings, ScheduledPlacements, Substitutes,
  GoalBoost, Adjustments, Goals, InteractionRegistry, AbsoluteAdjustments, PendingInteractions,
  ReasoningLog


  ## SolverSettings

  GoalBoostCap, GoalBoostFloor, AdditivePriorityScale, SwapDepth, ReversalMaxPasses,
  EfficiencyFloor, InventoryModeMaxProducts, DbModeProductLimit, DbModeCandidatePool,
  RegPinScoreFloor, MeasurementStepDefault, SignificantChangePct


  ## ConflictType enum

  SchedulingLoopConflict, ClashWarning, MedicalConstraintViolation, PrecisionConflict,
  ShortfallConflict, MissingBucket, InventoryExhausted, ScheduleLimitBreach, ScheduleAlignmentError,
  MissingBodyMetrics, ConfigurationError, EmptyInventoryConflict, PipelineLockedConflict,
  CriticalSafetyViolation, LethalBreachConflict, PinHardBlockedConflict, PinScoreFloorConflict,
  ServingReduced, ScheduleDeviation'
