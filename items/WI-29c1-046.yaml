title: Loop Detection Flowchart
description: '# Loop Detection Flowchart


  Scheduling displacement loop flowchart for Phase 4/5. Visual representation of loop
  detection and resolution in transactional allocation.


  Flow: Phase 4/5 allocation pass starts -> Products placed in order -> Displacement
  chain detected -> Global counter incremented -> If counter >= 3: loop confirmed
  -> Select lowest-utility non-pin victim -> Drop victim -> Re-run placement -> If
  all products in cycle are pins: raise SchedulingLoopConflict -> If resolution succeeds:
  continue normal allocation


  Key decision points:

  - Pin Sovereignty: Regular Pin never selected as victim

  - Pass Counter Isolation: Shortfall sub-passes don''t increment

  - Hard Conflict: All-pin cycle -> unresolvable halt


  Design reference: See Loop Detection Flowchart in obsidian for the complete diagram.'
