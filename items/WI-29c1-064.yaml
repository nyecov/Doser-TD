id: WI-29c1-064
title: Unix Binary Usage on Windows
description: '# Problem


  An AI agent used Unix-only binaries in a Windows PowerShell project, violating explicit
  environment and tooling rules.


  # Symptoms


  - Attempted `grep`, `rg`, and `tail` commands failed as unavailable binaries.

  - Root project rules requiring PowerShell-native commands were violated.

  - The user escalated the behavior as highest priority.


  # Root Cause


  Instruction drift caused the agent to fall back to Unix defaults because critical
  shell mandates were not sufficiently prominent in root-level context.


  # Resolution


  1. Hoisted hard environment rules and the PowerShell translation table into root
  instruction files.

  2. Added a mandatory command self-check.

  3. Added `tools/audit_environment_rules.ps1` as a regression audit.


  # Outcome


  Root instructions now proactively prohibit Unix binaries and the environment audit
  passes across instruction files.'
