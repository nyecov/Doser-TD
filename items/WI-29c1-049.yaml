id: WI-29c1-049
title: Dynamic RDI Guidelines
description: '# Dynamic RDI Guidelines


  Mathematical models for translating Garmin Sync biometrics into real-time RDI targets.


  ## Dosing Categories

  - Structural (S): LeanMass_eff x Coeff - Proteins, BCAAs, Creatine

  - Metabolic (M): Weight x Coeff - B-Vitamins, Vitamin C, Minerals

  - Fat-Soluble (F): BMI_adjusted_Coeff - Vitamins A, D, E, K

  - Volumetric (V): (Weight x Coeff) x Hydration_Mod - Sodium, Potassium, Magnesium


  ## Biometric Safety Gates

  - High Blood Pressure: Inject virtual tags to zero stimulants

  - Kidney Stress: Reduce potassium/phosphorus targets

  - Dehydration: Adjust electrolyte targets

  - Each gate has configurable thresholds and override rules


  ## Freshness & Recalculation

  - New sync triggers recalculation if change > significant_change_pct

  - Stale data (>7d) shows warning badge

  - Blocked data (>31d scale, >7d watch) prevents solver execution'
